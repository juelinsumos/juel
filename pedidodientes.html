<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUEL SAN CLEMENTE</title>
<style>
body{margin:0;font-family:Arial;background:#f2f6fa}
.top{background:#fff;text-align:center;padding:15px;border-bottom:6px solid #0a8dad}
.top img{height:100px}
.container{max-width:1100px;margin:auto;padding:10px 10px 150px}
.card{background:#fff;padding:14px;margin:12px 0;border-radius:10px;box-shadow:0 2px 8px #0001}
table{width:100%;border-collapse:collapse}
th{background:#1556a5;color:#fff;padding:8px 2px;font-size:11px;border:1px solid #fff}
td{border:1px solid #999;padding:0;text-align:center}
td.m{background:#1556a5;color:#fff;font-weight:800;width:60px}
td.m2{background:#1992c0;color:#fff;font-weight:800;width:60px}
td input{width:100%;border:0;padding:9px;text-align:center;font-weight:700}
.field{margin-bottom:8px}
.field label{font-weight:800;color:#0e4c9e;font-size:12px}
.field input{width:100%;padding:10px;border:2px solid #0a8dad;border-radius:8px}
.total{position:fixed;bottom:60px;left:0;right:0;background:#0a2a5a;color:#fff;text-align:center;padding:12px;font-weight:900}
.btns{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;justify-content:center;box-shadow:0 -2px 10px #0003}
.btn{background:#25D366;color:#fff;border:0;padding:14px 30px;border-radius:30px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div class="top">
<img src="logo.jpg">
<h2 style="color:#0a8dad;margin:5px 0 0">JUEL INSUMOS ODONTOLOGICOS</h2>
<b>SAN CLEMENTE DEL TUYU - ACRITONE - 2252 408943</b>
</div>

<div class="container">
<div class="card">
<h3 style="text-align:center;color:#0e4c9e;margin:0 0 10px 0">DATOS DEL CLIENTE</h3>
<div class="field"><label>NOMBRE Y APELLIDO *</label><input id="nombre" placeholder="Nombre del cliente"></div>
<div class="field"><label>CONTACTO / TELEFONO *</label><input id="contacto" placeholder="Ej: 2255 123456"></div>
<div class="field"><label>LOCALIDAD</label><input id="localidad" value="San Clemente del Tuyú"></div>
</div>

<div id="tablas"></div>
</div>

<div class="total">TOTAL: <span id="tg">0</span> tablillas</div>
<div class="btns"><button class="btn" onclick="mandar()">📱 MANDAR POR TELEFONO A JUEL</button></div>

<script>
colores=["61","62","66","67","81","65","68","69","71","77"];
tipos=[
{n:"ANTERO SUPERIOR",f:["16","18","20","22","25","26","28","30","32","34","36","38","40"]},
{n:"ANTERO INFERIOR",f:["16","18","20","25","26","30","32","36","38","40"]},
{n:"POSTERIOR SUPERIOR",f:["P4","P5","P6"]},
{n:"POSTERIOR INFERIOR",f:["P4","P5","P6"]}
];
function render(){
let h="";
tipos.forEach(t=>{
h+=`<div class="card"><b>${t.n}</b><table><tr><th>Modelo</th>`+colores.map(c=>`<th>${c}</th>`).join("")+`</tr>`;
t.f.forEach(m=>{
let cl=t.n.includes("POSTERIOR")?"m2":"m";
h+=`<tr><td class="${cl}">${m}</td>`+colores.map(c=>`<td><input id="${t.n}_${m}_${c}" type="number" min="0" placeholder="0" oninput="calc()"></td>`).join("")+`</tr>`;
});
h+=`</table></div>`;
});
document.getElementById("tablas").innerHTML=h;
}
render();

function calc(){
let tot=0;
tipos.forEach(t=>{t.f.forEach(m=>{colores.forEach(c=>{tot+=parseInt(document.getElementById(`${t.n}_${m}_${c}`).value)||0;});});});
document.getElementById("tg").innerText=tot;
}

function mandar(){
let n=document.getElementById("nombre").value;
let tel=document.getElementById("contacto").value;
let loc=document.getElementById("localidad").value;
let tot=document.getElementById("tg").innerText;
if(!n){alert("Falta NOMBRE Y APELLIDO");return;}
if(!tel){alert("Falta CONTACTO");return;}
if(tot=="0"){alert("Cargá dientes");return;}
let txt=`*PEDIDO JUEL - SAN CLEMENTE*%0ACliente: ${n}%0AContacto: ${tel}%0ALocalidad: ${loc}%0ATotal: ${tot} tablillas%0A`;
tipos.forEach(t=>{
t.f.forEach(m=>{
colores.forEach(c=>{
let el=document.getElementById(`${t.n}_${m}_${c}`);
let v=parseInt(el.value)||0;
if(v>0){txt+=`${t.n} ${m} Color ${c} x${v}%0A`;}
});
});
});
window.open(`https://wa.me/5492252408943?text=${txt}`,"_blank");
}
</script>
</body>
</html>
