<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUEL - San Clemente</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#f2f6fa}
.top{background:#fff;padding:16px;text-align:center;border-bottom:6px solid #0a8dad}
.top img{height:100px} .top h1{margin:8px 0 0 0;color:#0a8dad;font-size:22px}
.top p{margin:0;color:#333;font-weight:800}
.container{max-width:1150px;margin:0 auto;padding:10px 10px 180px 10px}
.card{background:#fff;border-radius:12px;padding:16px;margin:16px 0;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 12px 0;color:#0e4c9e;text-align:center;background:#e8f4fa;padding:10px;border-radius:8px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap} .field{flex:1;min-width:220px}
.field label{display:block;font-weight:800;font-size:12px;color:#0e4c9e;margin-bottom:4px}
.field input{width:100%;padding:12px;border:2px solid #0a8dad;border-radius:8px}
table{width:100%;border-collapse:collapse} th{background:#1556a5;color:#fff;padding:9px 2px;border:1px solid #fff;font-size:11px}
td{border:1px solid #bbb;padding:0;text-align:center;background:#fff}
td.modelo{background:#1556a5;color:#fff;font-weight:800;padding:8px;width:65px}
td.modelo2{background:#1992c0;color:#fff;font-weight:800;padding:8px;width:65px}
td input{width:100%;border:0;padding:10px;text-align:center;font-weight:700;outline:none}
.total-bar{position:fixed;bottom:75px;left:0;right:0;background:#0a2a5a;color:#fff;text-align:center;padding:14px;font-weight:900;font-size:18px}
.btns{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;gap:10px;justify-content:center;box-shadow:0 -4px 12px #0003}
.btn{flex:1;max-width:340px;padding:16px;border:0;border-radius:30px;font-weight:900;font-size:15px;cursor:pointer}
.wa{background:#25D366;color:#fff}.pdf{background:#111;color:#fff}
.seccion{color:#0e4c9e;font-weight:900;text-align:center;margin:20px 0 8px 0}
</style>
</head>
<body>
<div class="top">
<img src="logo.jpg">
<h1>JUEL INSUMOS ODONTOLOGICOS</h1>
<p>SAN CLEMENTE DEL TUYU - ACRITONE - 2252 408943</p>
</div>
<div class="container">
<div class="card">
<h2>📋 DATOS DEL CLIENTE - LISTADO DE PEDIDO</h2>
<div class="row">
<div class="field"><label>NOMBRE Y APELLIDO *</label><input id="nombre" type="text" placeholder="Ej: Juan Perez"></div>
<div class="field"><label>CONTACTO / TELEFONO *</label><input id="contacto" type="text" placeholder="Ej: 2255 123456"></div>
</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>LOCALIDAD</label><input id="localidad" type="text" value="San Clemente" placeholder="San Clemente"></div>
<div class="field"><label>LAB / DENTISTA</label><input id="lab" type="text" placeholder="Laboratorio"></div>
</div>
</div>
<div id="tablas"></div>
</div>
<div class="total-bar">TOTAL: <span id="tg">0</span> tablillas</div>
<div class="btns"><button class="btn pdf" onclick="alert('PDF Total '+document.getElementById('tg').innerText)">PDF</button><button class="btn wa" onclick="mandar()">📱 MANDAR POR TELEFONO A JUEL</button></div>
<script>
colores=["61","62","66","67","81","65","68","69","71","77"];
tipos=[{n:"ANTERO SUPERIOR",f:["16","18","20","22","25","26","28","30","32","34","36","38","40"]},{n:"ANTERO INFERIOR",f:["16","18","20","25","26","30","32","36","38","40"]},{n:"POSTERIOR SUPERIOR",f:["P4","P5","P6"]},{n:"POSTERIOR INFERIOR",f:["P4","P5","P6"]}];
function render(){let html="";tipos.forEach(t=>{html+=`<div class="card"><div class="seccion">${t.n}</div><table><tr><th>Modelo</th>`+colores.map(c=>`<th>${c}</th>`).join("")+`</tr>`;t.f.forEach(m=>{let cl=t.n.includes("POSTERIOR")?"modelo2":"modelo";html+=`<tr><td class="${cl}">${m}</td>`+colores.map(c=>`<td><input id="${t.n}_${m}_${c}" type="number" min="0" placeholder="0" oninput="calc()"></td>`).join("")+`</tr>`;});html+=`</table></div>`;});document.getElementById("tablas").innerHTML=html;}render();
function calc(){let tot=0;tipos.forEach(t=>{t.f.forEach(m=>{colores.forEach(c=>{tot+=parseInt(document.getElementById(`${t.n}_${m}_${c}`).value)||0;});});});document.getElementById("tg").innerText=tot;}
function getPedido(){let l=[];tipos.forEach(t=>{t.f.forEach(m=>{colores.forEach(c=>{let v=parseInt(document.getElementById(`${t.n}_${m}_${c}`).value)||0;if(v>0)l.push({tipo:t.n,modelo:m,color:c,cant:v});});});});return l;}
function mandar(){let nom=document.getElementById("nombre").value.trim();let cont=document.getElementById("contacto").value.trim();let loc=document.getElementById("localidad").value.trim();let lab=document.getElementById("lab").value.trim();let ped=getPedido();let tot=document.getElementById("tg").innerText;if(!nom){alert("Falta NOMBRE");return;}if(!cont){alert("Falta CONTACTO");return;}if(ped.length==0){alert("Cargá dientes");return;}let txt=`*PEDIDO JUEL - SAN CLEMENTE*%0A%0A*CLIENTE:* ${nom}%0A*CONTACTO:* ${cont}%0A*LOCALIDAD:* ${loc}%0A*LAB:* ${lab}%0A%0A*DETALLE:*%0A`;ped.forEach(p=>{txt+=`- ${p.tipo} Mod ${p.modelo} Color ${p.color} x ${p.cant}%0A`;});txt+=`%0A*TOTAL: ${tot} tablillas*`;window.open(`https://wa.me/5492252408943?text=${txt}`,"_blank");}
</script>
</body>
</html>
