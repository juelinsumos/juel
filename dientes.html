<div class="container">

<div class="card">
<h2>📋 DATOS DEL CLIENTE - LISTADO DE PEDIDO</h2>
<div class="row">
<div class="field"><label>NOMBRE Y APELLIDO *</label><input id="nombre" type="text" placeholder="Ej: Juan Perez"></div>
<div class="field"><label>CONTACTO / TELEFONO *</label><input id="contacto" type="text" placeholder="Ej: 2255 123456"></div>
</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>LOCALIDAD / DIRECCION</label><input id="localidad" type="text" placeholder="Ej: San Clemente"></div>
<div class="field"><label>DENTISTA / LABORATORIO</label><input id="lab" type="text" placeholder="Ej: Laboratorio Lopez"></div>
</div>
</div>

<div id="tablas"></div>

</div>

<div class="total-bar">TOTAL: <span id="tg">0</span> tablillas</div>
<div class="btns">
<button class="btn pdf" onclick="pdf()">📄 PDF</button>
<button class="btn wa" onclick="mandar()">📱 MANDAR POR TELEFONO A JUEL</button>
</div>

<script>
colores=["61","62","66","67","81","65","68","69","71","77"];
tipos=[
{n:"ANTERO SUPERIOR",f:["16","18","20","22","25","26","28","30","32","34","36","38","40"]},
{n:"ANTERO INFERIOR",f:["16","18","20","25","26","30","32","36","38","40"]},
{n:"POSTERIOR SUPERIOR",f:["P4","P5","P6"]},
{n:"POSTERIOR INFERIOR",f:["P4","P5","P6"]}
];

function render(){
let html="";
tipos.forEach(t=>{
html+=`<div class="card"><div class="seccion">${t.n} - TAMAÑOS</div><table><tr><th>Modelo</th>`+colores.map(c=>`<th>${c}</th>`).join("")+`</tr>`;
t.f.forEach(m=>{
let clase=t.n.includes("POSTERIOR")?"modelo2":"modelo";
html+=`<tr><td class="${clase}">${m}</td>`+colores.map(c=>`<td><input id="${t.n}_${m}_${c}" type="number" min="0" placeholder="0" oninput="calc()"></td>`).join("")+`</tr>`;
});
html+=`</table></div>`;
});
document.getElementById("tablas").innerHTML=html;
}
render();

function calc(){
let total=0;
tipos.forEach(t=>{t.f.forEach(m=>{colores.forEach(c=>{total+=parseInt(document.getElementById(`${t.n}_${m}_${c}`).value)||0;});});});
document.getElementById("tg").innerText=total;
}

function getPedido(){
let lista=[];
tipos.forEach(t=>{t.f.forEach(m=>{colores.forEach(c=>{let v=parseInt(document.getElementById(`${t.n}_${m}_${c}`).value)||0; if(v>0) lista.push({tipo:t.n, modelo:m, color:c, cant:v});});});});
return lista;
}

function mandar(){
let nombre=document.getElementById("nombre").value.trim();
let contacto=document.getElementById("contacto").value.trim();
let localidad=document.getElementById("localidad").value.trim();
let lab=document.getElementById("lab").value.trim();
let pedido=getPedido();
let total=document.getElementById("tg").innerText;

if(!nombre){alert("Falta NOMBRE Y APELLIDO del cliente"); document.getElementById("nombre").focus(); return;}
if(!contacto){alert("Falta CONTACTO del cliente"); document.getElementById("contacto").focus(); return;}
if(pedido.length==0){alert("Cargá al menos 1 diente"); return;}

let txt=`*PEDIDO JUEL - ACRITONE*%0A%0A`;
txt+=`*CLIENTE:* ${nombre}%0A`;
txt+=`*CONTACTO:* ${contacto}%0A`;
if(localidad) txt+=`*LOCALIDAD:* ${localidad}%0A`;
if(lab) txt+=`*LAB/DENT:* ${lab}%0A`;
txt+=`%0A*DETALLE:*%0A`;
pedido.forEach(p=>{txt+=`- ${p.tipo} Mod ${p.modelo} Color ${p.color} x ${p.cant}%0A`;});
txt+=`%0A*TOTAL: ${total} tablillas*%0A`;

window.open(`https://wa.me/5492252408943?text=${txt}`,"_blank");
}

function pdf(){
let pedido=getPedido();
if(pedido.length==0){alert("Cargá algo"); return;}
alert("PDF - Total "+document.getElementById("tg").innerText+" tablillas - "+pedido.length+" items");
}
</script>
