<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juel - Dientes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#9e9e9e;margin:0;font-family:Arial;text-align:center;padding-bottom:110px}
.header{background:#fff;padding:22px}
.logo{max-width:330px;width:90%;border-radius:16px;display:block;margin:0 auto 10px}
.card{max-width:650px;margin:14px auto;background:#fff;padding:16px;border-radius:16px;text-align:left}
.card input{width:100%;padding:13px;border:2px solid #25D366;border-radius:12px;box-sizing:border-box}
.tabla{max-width:650px;margin:0 auto 16px;background:#fff;border-radius:16px;overflow:hidden}
.tit{background:#111;color:#fff;padding:11px 14px;font-weight:700;text-align:left;font-size:13px}
.fila{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid #eee;text-align:left}
.qty{display:flex;gap:5px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid #25D366;background:#fff;font-weight:700}
.qty input{width:62px;padding:8px;border:2px solid #25D366;border-radius:10px;text-align:center;font-weight:800}
.btns{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;gap:8px;justify-content:center}
.btn{flex:1;max-width:200px;padding:14px;border:0;border-radius:30px;font-weight:800}
.btn-pdf{background:#111;color:#fff}.btn-wa{background:#25D366;color:#fff}
</style>
</head>
<body>
<div class="header">
<img src="Copia de juel 3.jpg" class="logo">
<h2>JUEL - PEDIDO DIENTES ACRITONE</h2>
<p>WhatsApp 2252 40-8943</p>
</div>
<div class="card">
<b>Nombre y Apellido *</b><br>
<input id="nombre" placeholder="Nombre del cliente"><br><br>
<b>Teléfono *</b><br>
<input id="tel" placeholder="Telefono">
</div>
<div id="lista"></div>
<div style="height:80px"></div>
<div class="btns">
<button class="btn btn-pdf" onclick="hacerPDF()">📄 PDF</button>
<button class="btn btn-wa" onclick="enviarWA()">📲 WHATSAPP</button>
</div>
<script>
const grupos=[
{t:"ANTERIOR SUPERIOR", items:["A1","A2","A3","A3.5","B1","B2","C1","C2"]},
{t:"ANTERIOR INFERIOR", items:["A1","A2","A3","A3.5","B1","B2"]},
{t:"POSTERIOR SUPERIOR", items:["A1","A2","A3","A3.5","B2"]},
{t:"POSTERIOR INFERIOR", items:["A1","A2","A3","A3.5","B2"]},
{t:"BLISTER", items:["Blister x28 surtido"]}
];
let html="",idx=0;
grupos.forEach(g=>{
html+=`<div class="tabla"><div class="tit">${g.t}</div>`;
g.items.forEach(it=>{
html+=`<div class="fila"><div><b>Acritone ${it}</b><br><small>$2.100</small></div><div class="qty"><button onclick="chg(${idx},-1)">-</button><input id="c${idx}" type="number" min="0" value="0"><button onclick="chg(${idx},1)">+</button></div></div>`;
idx++;
});
html+=`</div>`;
});
document.getElementById('lista').innerHTML=html;
function chg(i,d){let e=document.getElementById('c'+i);e.value=Math.max(0,(parseInt(e.value)||0)+d);}
function getDatos(){
let nom=document.getElementById('nombre').value;
let tel=document.getElementById('tel').value;
let items=[]; let n=0;
grupos.forEach(g=>{g.items.forEach(it=>{let c=parseInt(document.getElementById('c'+n).value)||0; if(c>0) items.push({nombre:`${g.t} ${it}`,cant:c}); n++;});});
return {nom,tel,items};
}
function hacerPDF(){
let {nom,tel,items}=getDatos();
if(!nom){alert("Poné nombre");return}
if(items.length==0){alert("Poné cantidad");return}
const {jsPDF}=window.jspdf; let doc=new jsPDF();
doc.text(`JUEL - PEDIDO DIENTES`,10,15);
doc.text(`Cliente: ${nom} - Tel: ${tel}`,10,25);
let y=35; items.forEach(it=>{doc.text(`${it.cant} x Acritone ${it.nombre}`,10,y); y+=7;});
doc.save(`Pedido-${nom}.pdf`);
}
function enviarWA(){
let {nom,tel,items}=getDatos();
if(!nom){alert("Poné nombre");return}
if(items.length==0){alert("Poné cantidad");return}
let txt=`Hola Juel soy ${nom} tel ${tel} %0APedido dientes:%0A`;
items.forEach(it=>{txt+=`- ${it.cant} x ${it.nombre}%0A`;});
window.open(`https://wa.me/5492252408943?text=${txt}`,'_blank');
}
</script>
</body>
</html>
